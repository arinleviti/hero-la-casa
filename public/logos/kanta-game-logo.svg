<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kanta Game logo</title>
  <defs>
    <linearGradient id="wordGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9FB4"/>
      <stop offset="35%" stop-color="#FFC98F"/>
      <stop offset="65%" stop-color="#8FE3C0"/>
      <stop offset="100%" stop-color="#B8A6F0"/>
    </linearGradient>
    <radialGradient id="micHeadGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFD97D"/>
    </radialGradient>
    <linearGradient id="micBodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39304A"/>
      <stop offset="50%" stop-color="#5B4E70"/>
      <stop offset="100%" stop-color="#39304A"/>
    </linearGradient>
    <clipPath id="micHeadClip">
      <circle cx="0" cy="0" r="34"/>
    </clipPath>

    <g id="note">
      <ellipse cx="0" cy="0" rx="12" ry="9" transform="rotate(-18)"/>
      <rect x="9" y="-58" width="5.5" height="60"/>
      <path d="M14.5,-58 C30,-52 32,-34 15,-24 C26,-36 25,-48 14.5,-50 Z"/>
    </g>
  </defs>

  <!-- shadow -->
  <text x="326" y="246" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="130" fill="#00000022">KANTA</text>

  <!-- wordmark -->
  <text x="320" y="240" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="130" fill="none" stroke="#39304A" stroke-width="14" stroke-linejoin="round" paint-order="stroke">KANTA</text>
  <text x="320" y="240" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="130" fill="url(#wordGradient)">KANTA</text>

  <!-- GAME -->
  <text x="320" y="310" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="10" fill="none" stroke="#39304A" stroke-width="7" stroke-linejoin="round" paint-order="stroke">GAME</text>
  <text x="320" y="310" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="10" fill="#8FE3C0">GAME</text>

  <!-- sound arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M666,95 A44,44 0 0 1 666,171" stroke="#8FE3C0" stroke-width="9"/>
    <path d="M682,74 A70,70 0 0 1 682,192" stroke="#B8A6F0" stroke-width="9"/>
  </g>

  <!-- microphone -->
  <g transform="translate(625,133) rotate(10)">
    <!-- body -->
    <path d="M-16,20 C-16,60 -13,95 0,120 C13,95 16,60 16,20 Z" fill="url(#micBodyGradient)" stroke="#39304A" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="0" cy="45" rx="13" ry="4" fill="#2B2438" opacity="0.5"/>
    <ellipse cx="0" cy="60" rx="12.5" ry="4" fill="#2B2438" opacity="0.5"/>
    <ellipse cx="0" cy="75" rx="12" ry="4" fill="#2B2438" opacity="0.5"/>
    <!-- collar -->
    <ellipse cx="0" cy="18" rx="19" ry="7" fill="#2B2438"/>
    <!-- head -->
    <circle cx="0" cy="-16" r="34" fill="url(#micHeadGradient)" stroke="#39304A" stroke-width="6"/>
    <g clip-path="url(#micHeadClip)" transform="translate(0,-16)">
      <g fill="#39304A" opacity="0.55">
        <circle cx="-18" cy="-18" r="2.6"/><circle cx="-6" cy="-20" r="2.6"/><circle cx="6" cy="-20" r="2.6"/><circle cx="18" cy="-18" r="2.6"/>
        <circle cx="-24" cy="-6" r="2.6"/><circle cx="-12" cy="-8" r="2.6"/><circle cx="0" cy="-9" r="2.6"/><circle cx="12" cy="-8" r="2.6"/><circle cx="24" cy="-6" r="2.6"/>
        <circle cx="-24" cy="6" r="2.6"/><circle cx="-12" cy="5" r="2.6"/><circle cx="0" cy="4" r="2.6"/><circle cx="12" cy="5" r="2.6"/><circle cx="24" cy="6" r="2.6"/>
        <circle cx="-18" cy="18" r="2.6"/><circle cx="-6" cy="17" r="2.6"/><circle cx="6" cy="17" r="2.6"/><circle cx="18" cy="18" r="2.6"/>
        <circle cx="0" cy="26" r="2.6"/>
      </g>
    </g>
    <ellipse cx="-11" cy="-27" rx="8" ry="5" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 -11 -27)"/>
  </g>

  <!-- music notes -->
  <use href="#note" fill="#FF9FB4" stroke="#39304A" stroke-width="4" transform="translate(95,140) rotate(-6) scale(1.05)"/>
  <use href="#note" fill="#B8A6F0" stroke="#39304A" stroke-width="3.6" transform="translate(650,340) rotate(8) scale(0.85)"/>

  <!-- sparkle -->
  <g fill="#FFD97D" stroke="#39304A" stroke-width="3">
    <path d="M108,250 L114,266 L130,272 L114,278 L108,294 L102,278 L86,272 L102,266 Z"/>
  </g>

</svg>
