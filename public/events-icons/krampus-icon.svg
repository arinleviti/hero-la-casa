<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Notte di Krampus</title>
  <defs>
    <radialGradient id="xmasBg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3E6B48"/>
      <stop offset="100%" stop-color="#173224"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A3C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- festive badge -->
  <circle cx="60" cy="58" r="54" fill="url(#xmasBg)"/>

  <!-- snowflakes -->
  <g fill="#F4EEDD">
    <circle cx="18" cy="26" r="1.6"/>
    <circle cx="102" cy="24" r="1.4"/>
    <circle cx="107" cy="50" r="1.6"/>
    <circle cx="12" cy="52" r="1.3"/>
    <circle cx="96" cy="98" r="1.4"/>
    <circle cx="22" cy="100" r="1.2"/>
  </g>

  <!-- holly sprig -->
  <g>
    <path d="M60,2 C52,6 50,14 56,18 C56,10 60,6 60,2 Z" fill="#3E8452"/>
    <path d="M60,2 C68,6 70,14 64,18 C64,10 60,6 60,2 Z" fill="#4E9C63"/>
    <circle cx="55" cy="16" r="3" fill="#C93A2E"/>
    <circle cx="60" cy="19" r="3" fill="#C93A2E"/>
    <circle cx="65" cy="16" r="3" fill="#C93A2E"/>
  </g>

  <!-- horns -->
  <path d="M40,36 C24,30 16,14 22,4 C24,16 34,22 44,26 Z" fill="#EDE3D3"/>
  <path d="M80,36 C96,30 104,14 98,4 C96,16 86,22 76,26 Z" fill="#EDE3D3"/>
  <path d="M40,36 C30,32 24,22 26,12" fill="none" stroke="#C9BCA0" stroke-width="2" opacity="0.6"/>
  <path d="M80,36 C90,32 96,22 94,12" fill="none" stroke="#C9BCA0" stroke-width="2" opacity="0.6"/>

  <!-- fur ruff -->
  <g fill="#3E2A22">
    <path d="M22,60 L30,78 L18,90 L14,72 Z"/>
    <path d="M98,60 L90,78 L102,90 L106,72 Z"/>
    <path d="M30,88 L36,104 L24,110 L18,94 Z"/>
    <path d="M90,88 L84,104 L96,110 L102,94 Z"/>
    <path d="M46,100 L52,114 L40,116 L36,102 Z"/>
    <path d="M74,100 L68,114 L80,116 L84,102 Z"/>
    <path d="M60,104 L66,118 L54,118 L54,104 Z"/>
  </g>

  <!-- face -->
  <path d="M60,34 C80,34 90,50 88,68 C86,88 74,98 60,98 C46,98 34,88 32,68 C30,50 40,34 60,34 Z" fill="#5A3A28"/>

  <!-- eyebrow ridge -->
  <path d="M40,56 C46,50 54,50 58,54" fill="none" stroke="#2E1D14" stroke-width="4" stroke-linecap="round"/>
  <path d="M80,56 C74,50 66,50 62,54" fill="none" stroke="#2E1D14" stroke-width="4" stroke-linecap="round"/>

  <!-- glowing eyes -->
  <circle cx="47" cy="62" r="9" fill="url(#eyeGlow)"/>
  <circle cx="73" cy="62" r="9" fill="url(#eyeGlow)"/>
  <ellipse cx="47" cy="62" rx="4.2" ry="5.2" fill="#FF5A3C"/>
  <ellipse cx="73" cy="62" rx="4.2" ry="5.2" fill="#FF5A3C"/>
  <ellipse cx="47" cy="62" rx="1.6" ry="2.2" fill="#3A0F0A"/>
  <ellipse cx="73" cy="62" rx="1.6" ry="2.2" fill="#3A0F0A"/>

  <!-- nose -->
  <ellipse cx="60" cy="76" rx="6" ry="4.5" fill="#3E2A22"/>

  <!-- mouth with fangs and tongue -->
  <path d="M42,84 Q60,98 78,84 Q76,94 60,96 Q44,94 42,84 Z" fill="#2E1D14"/>
  <path d="M46,85 Q60,94 74,85 Q60,90 46,85 Z" fill="#C93A2E"/>
  <path d="M49,84 L52,90 L55,84 Z" fill="#F4EEDD"/>
  <path d="M71,84 L68,90 L65,84 Z" fill="#F4EEDD"/>

</svg>
