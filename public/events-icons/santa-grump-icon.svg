<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Babbo Natale e l'amico burbero verde</title>
  <defs>
    <radialGradient id="xmasBg2" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#7A2A2A"/>
      <stop offset="100%" stop-color="#3A1212"/>
    </radialGradient>
  </defs>

  <!-- festive badge -->
  <circle cx="60" cy="58" r="54" fill="url(#xmasBg2)"/>

  <!-- snowflakes -->
  <g fill="#F4EEDD">
    <circle cx="60" cy="14" r="1.5"/>
    <circle cx="16" cy="30" r="1.3"/>
    <circle cx="104" cy="30" r="1.3"/>
    <circle cx="10" cy="60" r="1.4"/>
    <circle cx="110" cy="60" r="1.4"/>
  </g>

  <!-- GRUMPY GREEN FRIEND (left) -->
  <g transform="translate(26,62) scale(1.3)">
    <!-- ear tufts -->
    <ellipse cx="-19" cy="-8" rx="6" ry="9" fill="#3E7A45" transform="rotate(-20 -19 -8)"/>
    <ellipse cx="19" cy="-8" rx="6" ry="9" fill="#3E7A45" transform="rotate(20 19 -8)"/>
    <!-- head -->
    <path d="M0,-30 C18,-30 26,-16 24,0 C22,18 12,28 0,28 C-12,28 -22,18 -24,0 C-26,-16 -18,-30 0,-30 Z" fill="#4E9C5B"/>
    <!-- eyebrows -->
    <path d="M-16,-4 C-11,-10 -3,-10 1,-6" fill="none" stroke="#20401F" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M16,-4 C11,-10 3,-10 -1,-6" fill="none" stroke="#20401F" stroke-width="3.4" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="-9" cy="1" r="3.4" fill="#20401F"/>
    <circle cx="9" cy="1" r="3.4" fill="#20401F"/>
    <!-- sly grin -->
    <path d="M-13,12 C-6,22 6,22 13,12 C6,16 -6,16 -13,12 Z" fill="#20401F"/>
    <path d="M-9,13.5 C-4,18 4,18 9,13.5 C4,15.5 -4,15.5 -9,13.5 Z" fill="#F4EEDD"/>
  </g>

  <!-- SANTA (right) -->
  <g transform="translate(88,64) scale(1.25)">
    <!-- hat -->
    <path d="M-22,-14 C-14,-34 14,-34 22,-14 C10,-20 -10,-20 -22,-14 Z" fill="#C93A2E"/>
    <path d="M-24,-13 C-8,-19 8,-19 24,-13 L24,-6 L-24,-6 Z" fill="#F4EEDD"/>
    <circle cx="22" cy="-30" r="5" fill="#F4EEDD"/>
    <!-- face -->
    <path d="M0,-6 C16,-6 22,6 20,16 C18,26 10,30 0,30 C-10,30 -18,26 -20,16 C-22,6 -16,-6 0,-6 Z" fill="#EFC49A"/>
    <!-- cheeks -->
    <circle cx="-11" cy="12" r="4" fill="#E88C7D" opacity="0.7"/>
    <circle cx="11" cy="12" r="4" fill="#E88C7D" opacity="0.7"/>
    <!-- eyes -->
    <circle cx="-8" cy="4" r="2.2" fill="#2E1D14"/>
    <circle cx="8" cy="4" r="2.2" fill="#2E1D14"/>
    <!-- nose -->
    <circle cx="0" cy="12" r="4.2" fill="#E88C7D"/>
    <!-- mustache -->
    <path d="M-15,15 C-8,10 -3,15 0,13 C3,15 8,10 15,15 C10,26 -10,26 -15,15 Z" fill="#F4EEDD"/>
    <!-- beard -->
    <path d="M-17,18 C-17,34 -8,42 0,42 C8,42 17,34 17,18 C12,26 -12,26 -17,18 Z" fill="#F4EEDD"/>
  </g>

</svg>
