<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fuochi di San Martino</title>
  <defs>
    <radialGradient id="nightSky" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3B3B63"/>
      <stop offset="100%" stop-color="#221E3A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFD873" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD873" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night badge -->
  <circle cx="60" cy="58" r="54" fill="url(#nightSky)"/>

  <!-- stars -->
  <circle cx="30" cy="20" r="1.6" fill="#F4EEDD"/>
  <circle cx="90" cy="18" r="1.3" fill="#F4EEDD"/>
  <circle cx="98" cy="34" r="1.6" fill="#F4EEDD"/>
  <circle cx="18" cy="34" r="1.2" fill="#F4EEDD"/>

  <!-- moon -->
