<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Desmontegada</title>

  <!-- ears -->
  <ellipse cx="22" cy="52" rx="14" ry="10" fill="#C98B5E" transform="rotate(-25 22 52)"/>
  <ellipse cx="98" cy="52" rx="14" ry="10" fill="#C98B5E" transform="rotate(25 98 52)"/>
  <ellipse cx="24" cy="52" rx="7" ry="5" fill="#E7B48A" transform="rotate(-25 24 52)"/>
  <ellipse cx="96" cy="52" rx="7" ry="5" fill="#E7B48A" transform="rotate(25 96 52)"/>

  <!-- horns -->
  <path d="M35,38 C30,28 32,20 40,16" fill="none" stroke="#EDE3D3" stroke-width="6" stroke-linecap="round"/>
  <path d="M85,38 C90,28 88,20 80,16" fill="none" stroke="#EDE3D3" stroke-width="6" stroke-linecap="round"/>

  <!-- head -->
  <path d="M60,30 C84,30 96,48 92,72 C89,94 76,104 60,104 C44,104 31,94 28,72 C24,48 36,30 60,30 Z" fill="#C98B5E"/>

  <!-- white face patch -->
  <path d="M60,52 C70,52 76,62 74,76 C72,92 66,98 60,98 C54,98 48,92 46,76 C44,62 50,52 60,52 Z" fill="#FBF3E7"/>

  <!-- eyes -->
  <ellipse cx="45" cy="62" rx="4.5" ry="5.5" fill="#3A2A20"/>
  <ellipse cx="75" cy="62" rx="4.5" ry="5.5" fill="#3A2A20"/>
  <circle cx="46.5" cy="60" r="1.4" fill="#fff"/>
  <circle cx="76.5" cy="60" r="1.4" fill="#fff"/>

  <!-- nose -->
  <ellipse cx="60" cy="86" rx="15" ry="10" fill="#E8A9A0"/>
  <ellipse cx="54" cy="86" rx="2.4" ry="3.4" fill="#8B4A42"/>
  <ellipse cx="66" cy="86" rx="2.4" ry="3.4" fill="#8B4A42"/>

  <!-- brown patches -->
  <ellipse cx="35" cy="78" rx="7" ry="9" fill="#B87A4E" opacity="0.9"/>
  <ellipse cx="86" cy="70" rx="8" ry="10" fill="#B87A4E" opacity="0.9"/>

  <!-- flower crown -->
  <g>
    <path d="M30,36 Q45,20 60,30 Q75,20 90,36" fill="none" stroke="#6E9B4A" stroke-width="4" stroke-linecap="round"/>
    <!-- leaves -->
    <ellipse cx="42" cy="26" rx="5" ry="2.4" fill="#6E9B4A" transform="rotate(-30 42 26)"/>
    <ellipse cx="78" cy="26" rx="5" ry="2.4" fill="#6E9B4A" transform="rotate(30 78 26)"/>

    <!-- flowers -->
    <g transform="translate(34,30)">
      <circle r="3" fill="#F2A6C4"/>
      <circle cx="-4.5" cy="-2" r="3" fill="#F2A6C4"/>
      <circle cx="4.5" cy="-2" r="3" fill="#F2A6C4"/>
      <circle cx="-2.5" cy="3.5" r="3" fill="#F2A6C4"/>
      <circle cx="2.5" cy="3.5" r="3" fill="#F2A6C4"/>
      <circle r="2" fill="#F7D65C"/>
    </g>
    <g transform="translate(60,17)">
      <circle r="3.4" fill="#F7D65C"/>
      <circle cx="-5" cy="-2.2" r="3.4" fill="#F7D65C"/>
      <circle cx="5" cy="-2.2" r="3.4" fill="#F7D65C"/>
      <circle cx="-3" cy="4" r="3.4" fill="#F7D65C"/>
      <circle cx="3" cy="4" r="3.4" fill="#F7D65C"/>
      <circle r="2.2" fill="#E8734A"/>
    </g>
    <g transform="translate(86,30)">
      <circle r="3" fill="#B78CD9"/>
      <circle cx="-4.5" cy="-2" r="3" fill="#B78CD9"/>
      <circle cx="4.5" cy="-2" r="3" fill="#B78CD9"/>
      <circle cx="-2.5" cy="3.5" r="3" fill="#B78CD9"/>
      <circle cx="2.5" cy="3.5" r="3" fill="#B78CD9"/>
      <circle r="2" fill="#F7D65C"/>
    </g>
  </g>

  <!-- collar + bell -->
  <path d="M42,100 Q60,110 78,100" fill="none" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round"/>
  <rect x="53" y="103" width="14" height="13" rx="3" fill="#E0A93C" stroke="#8B5A2B" stroke-width="2"/>
  <circle cx="60" cy="113" r="1.6" fill="#8B5A2B"/>

</svg>
